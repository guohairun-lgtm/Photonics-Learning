<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>光子学在线学习平台 | Photonics Learning WebBook</title>
<style>
:root {
  --c-bg: #ffffff;
  --c-bg-sec: #f7f6f3;
  --c-bg-ter: #f1efe8;
  --c-text: #2c2c2a;
  --c-text-sec: #5f5e5a;
  --c-text-hint: #888780;
  --c-border: #e0ddd3;
  --c-purple-50: #EEEDFE;
  --c-purple-100: #CECBF6;
  --c-purple-400: #7F77DD;
  --c-purple-600: #534AB7;
  --c-purple-800: #3C3489;
  --sidebar-w: 270px;
  --header-h: 54px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--c-bg-ter); color: var(--c-text); }

.app-header {
  height: var(--header-h);
  background: var(--c-bg);
  border-bottom: 1px solid var(--c-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  position: relative;
  z-index: 30;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.menu-btn {
  display: none;
  width: 34px; height: 34px;
  border: 1px solid var(--c-border);
  border-radius: 8px;
  background: var(--c-bg-sec);
  color: var(--c-purple-800);
  font-size: 18px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--c-purple-800); }
.brand-logo {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, var(--c-purple-600), var(--c-purple-400));
  color: #fff; font-weight: 700; font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center;
}
.brand-title { font-size: 15.5px; font-weight: 700; letter-spacing: 0.01em; }
.brand-sub { font-size: 11.5px; color: var(--c-text-hint); margin-left: 6px; font-weight: 400; }
.header-right { display: flex; align-items: center; gap: 8px; }
.nav-pill {
  padding: 5px 11px; font-size: 12px; border-radius: 6px;
  border: 1px solid var(--c-border); background: var(--c-bg-sec);
  color: var(--c-text-sec); cursor: pointer; font-family: inherit; transition: all 0.15s;
}
.nav-pill:hover { border-color: var(--c-purple-400); color: var(--c-purple-600); background: var(--c-purple-50); }
.nav-pill:disabled { opacity: 0.4; cursor: not-allowed; }

.app-body {
  display: flex;
  height: calc(100% - var(--header-h));
  position: relative;
}
.sidebar {
  width: var(--sidebar-w);
  background: var(--c-bg);
  border-right: 1px solid var(--c-border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  padding: 12px 10px 20px;
  transition: transform 0.22s ease;
  z-index: 25;
}
.nav-group-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--c-text-hint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 6px 10px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 10px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--c-text-sec);
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  width: 100%;
  font-family: inherit;
  transition: all 0.14s;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--c-bg-sec); color: var(--c-purple-800); }
.nav-item.active { background: var(--c-purple-50); color: var(--c-purple-800); font-weight: 600; }
.nav-num {
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--c-bg-sec); color: var(--c-text-hint);
  font-size: 11.5px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.nav-item.active .nav-num { background: var(--c-purple-600); color: #fff; }
.nav-label { flex: 1; line-height: 1.35; }

.content-wrap {
  flex: 1;
  min-width: 0;
  height: 100%;
  background: var(--c-bg-ter);
  position: relative;
}
.content-frame {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  background: var(--c-bg-ter);
}
.backdrop {
  display: none;
  position: fixed;
  inset: var(--header-h) 0 0 0;
  background: rgba(20, 20, 30, 0.35);
  z-index: 20;
}
.backdrop.show { display: block; }

@media (max-width: 820px) {
  .menu-btn { display: inline-flex; }
  .brand-sub { display: none; }
  .sidebar {
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    transform: translateX(-100%);
    box-shadow: 4px 0 20px rgba(0, 0, 0, 0.12);
  }
  .sidebar.open { transform: translateX(0); }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <button class="menu-btn" id="menuBtn" aria-label="切换目录">☰</button>
    <a class="brand" href="#overview.html" onclick="loadPage('overview.html'); return false;">
      <span class="brand-logo">光</span>
      <span class="brand-title">光子学在线学习平台</span>
      <span class="brand-sub">Photonics Learning WebBook</span>
    </a>
  </div>
  <div class="header-right">
    <button class="nav-pill" id="prevBtn" onclick="stepPage(-1)">← 上一章</button>
    <button class="nav-pill" id="nextBtn" onclick="stepPage(1)">下一章 →</button>
  </div>
</header>

<div class="app-body">
  <div class="backdrop" id="backdrop" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="nav-group-title">书本导航</div>
    <div id="navList"></div>
  </aside>
  <main class="content-wrap">
    <iframe id="contentFrame" class="content-frame" src="overview.html" title="章节内容"></iframe>
  </main>
</div>

<script>
(function() {
  var PAGES = [
    { file: 'overview.html', num: '目', title: '内容概述与总目录' },
    { file: 'fp-cavity.html', num: '1', title: 'F-P 光学腔' },
    { file: 'fp-dynamics.html', num: '2', title: 'F-P 腔动力学方程' },
    { file: 'fp-laser.html', num: '3', title: 'F-P 腔激光器' },
    { file: 'injection-locking.html', num: '4', title: '激光注入锁定' },
    { file: 'self-injection-locking.html', num: '5', title: '激光-微腔自注入锁定' },
    { file: 'kerr-dissipative-soliton.html', num: '6', title: 'Kerr 耗散孤子' },
    { file: 'general-dissipative-soliton.html', num: '7', title: '广义耗散孤子 (CGLE/Kelly)' },
    { file: 'ftir-spectroscopy.html', num: '8', title: '光场自干涉与 FTIR 光谱仪' },
    { file: 'frog-measurement.html', num: '9', title: '脉冲自相关与 FROG 测量' },
    { file: 'pulsed-laser-comb.html', num: '10', title: '脉冲式激光的时频域关系' },
    { file: 'nonlinear-pulse-propagation.html', num: '11', title: '非线性时域脉冲传输 (GNLSE)' }
  ];

  var navList = document.getElementById('navList');
  var frame = document.getElementById('contentFrame');
  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('backdrop');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var currentIdx = 0;

  PAGES.forEach(function(p, idx) {
    var btn = document.createElement('button');
    btn.className = 'nav-item' + (idx === 0 ? ' active' : '');
    btn.dataset.file = p.file;
    btn.innerHTML = '<span class="nav-num">' + p.num + '</span><span class="nav-label">' + p.title + '</span>';
    btn.addEventListener('click', function() { loadPage(p.file); });
    navList.appendChild(btn);
  });

  window.toggleSidebar = function(force) {
    var open = typeof force === 'boolean' ? force : !sidebar.classList.contains('open');
    sidebar.classList.toggle('open', open);
    backdrop.classList.toggle('show', open);
  };
  document.getElementById('menuBtn').addEventListener('click', function() { toggleSidebar(); });

  window.loadPage = function(rawSrc) {
    var file = String(rawSrc || 'overview.html').replace(/^tabs\//, '').replace(/^#/, '');
    var idx = PAGES.findIndex(function(p) { return p.file === file; });
    if (idx < 0) idx = 0;
    currentIdx = idx;
    var target = PAGES[idx].file;
    if (frame.getAttribute('src') !== target) frame.setAttribute('src', target);
    document.querySelectorAll('.nav-item').forEach(function(el, i) {
      el.classList.toggle('active', i === idx);
    });
    prevBtn.disabled = (idx <= 0);
    nextBtn.disabled = (idx >= PAGES.length - 1);
    if (window.location.hash !== '#' + target) {
      try { history.replaceState(null, '', '#' + target); } catch (e) {}
    }
    toggleSidebar(false);
  };

  window.stepPage = function(delta) {
    var next = currentIdx + delta;
    if (next >= 0 && next < PAGES.length) loadPage(PAGES[next].file);
  };

  // Listen for chapter clicks from overview.html iframe
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'switchTab' && e.data.src) {
      loadPage(e.data.src);
    }
  });

  // Support direct hash links like index.html#frog-measurement.html
  var initHash = window.location.hash ? window.location.hash.slice(1) : 'overview.html';
  loadPage(initHash);
})();
</script>
</body>
</html>
